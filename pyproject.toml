[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xreticolo"
version = "0.1.0"
description = "Python bindings for Blazr/RETICOLO x-ray grating diffraction calculations, running on GNU Octave"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Antoine Wojdyla", email = "awojdyla@lbl.gov" },
]
keywords = ["x-ray", "grating", "diffraction", "RCWA", "reticolo", "synchrotron", "optics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/ALS-X-Ray-optics/xReticolo"
Repository = "https://github.com/ALS-X-Ray-optics/xReticolo"

[project.optional-dependencies]
examples = ["numpy", "matplotlib", "jupyter"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xreticolo = ["_resources/**/*"]
